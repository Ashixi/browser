version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: browser_frontend
    volumes:
      - .:/workspace
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=development
    command: npm run dev 

  profile-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: browser_profile_mock
    volumes:
      - .:/workspace
    ports:
      - "8040:8040"
    environment:
      - RUST_BACKTRACE=1
    command: cargo run --bin profile_server

  p2p-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: browser_p2p_mock
    volumes:
      - .:/workspace
    ports:
      - "8041:8041"
      - "9000:9000"
    environment:
      - RUST_BACKTRACE=1
    command: cargo run --bin p2p_node